<!DOCTYPE html>
<html>
<head>
    <title>BloodLink Menu Test</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
        }

        nav {
            background: #b91c2c;
            padding: 15px;
        }

        button {
            padding: 12px 18px;
            margin: 5px;
            cursor: pointer;
        }

        section {
            display: none;
            padding: 40px;
        }

        section.active {
            display: block;
        }
    </style>
</head>

<body>

<nav>

    <button data-page="home">
        🏠 Home
    </button>

    <button data-page="search">
        🔎 Search Donors
    </button>

    <button data-page="register">
        🩸 Donor Register
    </button>

    <button data-page="compatibility">
        🩸 Compatibility
    </button>

</nav>


<section id="home" class="active">
    <h1>🏠 Home</h1>
    <p>BloodLink Home</p>
</section>


<section id="search">
    <h1>🔎 Search Donors</h1>
    <p>Search donor page</p>
</section>


<section id="register">
    <h1>🩸 Donor Register</h1>
    <p>Registration page</p>
</section>


<section id="compatibility">
    <h1>🩸 Blood Compatibility</h1>
    <p>Compatibility page</p>
</section>


<script>

document.querySelectorAll("button").forEach(function(button) {

    button.addEventListener("click", function() {

        const page =
            button.getAttribute("data-page");

        document.querySelectorAll("section").forEach(
            function(section) {

                section.classList.remove("active");

            }
        );

        document
            .getElementById(page)
            .classList.add("active");

    });

});

</script>

</body>
</html>
